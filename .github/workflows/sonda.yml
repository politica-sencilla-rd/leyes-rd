name: "Sonda: ¿llegan los robots a cada fuente? (manual)"
# Phase 0 of the rollout. Run it by hand once: one request per official source
# from a GitHub runner, plus one Gemini call. Never commits.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sonda
  cancel-in-progress: true

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && pdftotext -v
      - run: pip install -q -r requirements-auto.txt
      - name: Pruebas (incluye la lectura de 2 actas reales con pdftotext)
        run: python -m pytest -q tests
      - name: Una petición por fuente + una llamada a Gemini
        run: python scripts/auto/sonda.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonda-${{ github.run_id }}
          path: .psrd-run/
          include-hidden-files: true
